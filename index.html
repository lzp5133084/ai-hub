function csvEsc(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},3000);}

var exp={
  sheets:function(){
    var S={};

    for(var c in (R.models||{})){(R.models[c]||[]).forEach(function(m){sm.push([c,m]);});}

      ((R.billing||{}).months||[]).map(function(m){return [m.period,m.amount,m.desc];}));

    return S;

  excel:function(){
    function go(){
      var wb=XLSX.utils.book_new(), S=exp.sheets();
      for(var n in S){
        var ws=XLSX.utils.aoa_to_sheet(S[n]);
        ws['!cols']=[{wch:18},{wch:12},{wch:12},{wch:40},{wch:34},{wch:34},{wch:38},{wch:34}];
        XLSX.utils.book_append_sheet(wb,ws,n);
      }
      XLSX.writeFile(wb,'AI资产总览_'+(REPORT.generated_at||'').slice(0,10)+'.xlsx');
    }
    if(window.XLSX){go();return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=go; s.onerror=exp.xlsFallback; document.head.appendChild(s);
  },
  xlsFallback:function(){
    function tbl(rows){var h="<table border='1'><tr>";
      rows[0].forEach(function(c){h+="<th style='background:#DDEBF7;font-weight:bold'>"+esc(c)+"</th>";});
      h+="</tr>";
      for(var i=1;i<rows.length;i++){h+="<tr>";rows[i].forEach(function(c){h+="<td>"+esc(c)+"</td>";});h+="</tr>";}
      return h+"</table>";}
    var S=exp.sheets(), html="<html xmlns:x='urn:schemas-microsoft-com:office:excel'><head><meta charset='UTF-8'></head><body>";
    for(var n in S){html+="<h3>"+esc(n)+"</h3>"+tbl(S[n]);}
    html+="</body></html>";
    dl(new Blob(["\ufeff"+html],{type:'application/vnd.ms-excel;charset=utf-8'}),'AI资产总览.xls');
  },
  csv:function(){
    var rows=exp.sheets()['API密钥'];
    var txt=rows.map(function(r){return r.map(csvEsc).join(',');}).join('\r\n');
    dl(new Blob(["\ufeff"+txt],{type:'text/csv;charset=utf-8'}),'API密钥表_'+(REPORT.generated_at||'').slice(0,10)+'.csv');
  }
};
